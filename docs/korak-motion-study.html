<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Korak — motion feasibility studies</title>
<style>
body{margin:0;background:#0c171b;color:#d3e6e4;font:15px system-ui;text-align:center}main{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;padding:20px}figure{margin:0}figcaption{margin:8px}.scene{position:relative;overflow:hidden;width:220px;height:330px;border:2px solid #596d79;background:radial-gradient(circle at 50% 35%,#284447,#102528 55%,#10171e)}img{position:absolute;object-fit:contain}.rope{left:42px;top:42px;width:136px;height:204px;transform-origin:50% 2%;animation:rope 3.5s ease-in-out infinite alternate}.peg{position:absolute;left:107px;top:42px;width:6px;height:6px;background:#cad9d4;border-radius:50%}.rainclip{position:absolute;inset:20px;overflow:hidden;mask-image:linear-gradient(transparent,white 18%,white 82%,transparent);-webkit-mask-image:linear-gradient(transparent,white 18%,white 82%,transparent)}.rain{position:absolute;left:0;top:-50%;width:100%;height:200%;background:url('../assets/cards/korak/studies/rain-bright.png') center/100% 50% repeat-y}.branch{position:absolute;left:20px;top:95px;width:180px;height:21px;border-radius:35%;background:linear-gradient(#60736a,#273e36);box-shadow:0 3px 4px #0008}.drip{position:absolute;left:78px;top:113px;width:65px;height:65px;background:url('../assets/cards/korak/studies/drip-sheet.png') 0 0/400% 200% no-repeat}.bead{position:absolute;left:108px;top:106px;width:6px;height:8px;border-radius:50%;background:#92e5f5}.legend{max-width:750px;margin:auto;color:#a8c2c4}@keyframes rope{to{transform:rotate(7deg)}}@media(prefers-reduced-motion:reduce){.rope{animation:none}}
</style><h1>Korak: pre-base motion studies</h1><p class="legend">Historical prototypes only. The drip and first branch composition were replaced after user feedback; see KORAK_PLAN.md for the current lightning and fitted branch.</p>
<style>.composition .art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.composition .rainclip{inset:8% 7% 20%;opacity:.3}.composition .actor{position:absolute;inset:0;transform:translateY(-10%) scale(.85)}.composition .actor .rope{position:absolute;left:66%;top:62%;width:18%;height:18%;transform-origin:50% 2%}.composition .drip{left:25%;top:69%;width:12%;height:auto;aspect-ratio:1}</style>
<main><figure><div class="scene"><span class="peg"></span><img class="rope" src="../assets/cards/korak/studies/rope.png" alt=""></div><figcaption>Grass rope: fixed pivot</figcaption></figure>
<figure><div class="scene"><div class="rainclip"><div class="rain a"></div><div class="rain b"></div></div></div><figcaption>Canopy rain: overlapped handoff</figcaption></figure>
<figure><div class="scene"><div class="drip"></div><div class="branch"></div></div><figcaption>Branch drip: anchored frames</figcaption></figure>
<figure><div class="scene composition"><img class="art" src="../assets/cards/korak/studies/canopy-clean.png" alt=""><div class="rainclip"><div class="rain a"></div><div class="rain b"></div></div><div class="drip"></div><div class="actor"><img class="art" src="../assets/cards/korak/studies/character-study.png" alt=""><img class="rope" src="../assets/cards/korak/studies/rope.png" alt=""></div></div><figcaption>Preliminary attachment and depth</figcaption></figure></main>
<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)'),as=document.querySelectorAll('.rain.a'),bs=document.querySelectorAll('.rain.b'),ds=document.querySelectorAll('.drip');
function draw(ms){let p=reduce.matches?0:(ms%4000)/4000, q=(p+.5)%1;as.forEach(a=>a.style.transform=`translateY(${(p-.5)*50}%)`);bs.forEach(b=>{b.style.transform=`translateY(${(q-.5)*50}%)`;b.style.opacity=Math.cos(Math.PI*p)**2});let f=reduce.matches?0:Math.floor(ms/160)%8;ds.forEach(d=>d.style.backgroundPosition=`${f%4*100/3}% ${f<4?0:100}%`);requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
