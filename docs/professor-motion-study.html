<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Professor Porter — motion studies</title>
<style>body{margin:0;background:#171b1c;color:#eee2c9;font:15px system-ui;text-align:center}main{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;padding:20px}figure{margin:0}figcaption{margin:8px}.scene{position:relative;overflow:hidden;width:220px;height:330px;border:2px solid #846e51;background:radial-gradient(circle at 50% 40%,#454a38,#262c28 60%,#171c1d)}.sheet{position:absolute;background-size:400% 200%;background-repeat:no-repeat}.book{left:20px;top:100px;width:180px;height:180px;background-image:url('../assets/cards/professor/studies/journal-sheet.png')}.butterfly{left:65px;top:112px;width:90px;height:90px;background-image:url('../assets/cards/professor/studies/butterfly-sheet.png')}.leaf{position:absolute;left:50px;top:183px;width:120px;height:28px;border-radius:100% 0;background:#52744b;transform:rotate(-8deg)}.cup{position:absolute;left:78px;top:224px;width:64px;height:40px;border-radius:5px 5px 25px 25px;background:linear-gradient(90deg,#a88e69,#ead9bd,#8f7759)}.steamWindow{position:absolute;left:66px;top:83px;width:88px;height:140px;overflow:hidden;mask-image:linear-gradient(transparent,white 30%,white 85%,transparent);-webkit-mask-image:linear-gradient(transparent,white 30%,white 85%,transparent)}.steam{position:absolute;inset:-20% 0;width:100%;height:140%;object-fit:contain;opacity:.45}</style>
<style>.composition .art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.composition .actor{transform:translateY(-5%) scale(.85)}.composition .desk{clip-path:inset(56.5% 0 0 0)}.composition .book{left:31%;top:49%;width:38%;height:auto;aspect-ratio:1}.composition .butterfly{left:2%;top:41%;width:20%;height:auto;aspect-ratio:1}.composition .steamWindow{left:79%;top:41%;width:16%;height:16%}</style>
<h1>Professor Porter: pre-base motion studies</h1><p>Studies only: registration, attachment, full loops and phone-size visibility must pass before final approval.</p><main>
<figure><div class="scene"><div class="sheet book"></div></div><figcaption>Journal page</figcaption></figure><figure><div class="scene"><div class="leaf"></div><div class="sheet butterfly"></div></div><figcaption>Butterfly wing poses</figcaption></figure><figure><div class="scene"><div class="steamWindow"><img class="steam a" src="../assets/cards/professor/studies/steam.png" alt=""><img class="steam b" src="../assets/cards/professor/studies/steam.png" alt=""></div><div class="cup"></div></div><figcaption>Local cup steam</figcaption></figure><figure><div class="scene composition"><img class="art" src="../assets/cards/professor/studies/shelter-study.png" alt=""><img class="art actor" src="../assets/cards/professor/studies/professor-study.png" alt=""><img class="art desk" src="../assets/cards/professor/studies/shelter-study.png" alt=""><div class="sheet book"></div><div class="sheet butterfly"></div><div class="steamWindow"><img class="steam a" src="../assets/cards/professor/studies/steam.png" alt=""><img class="steam b" src="../assets/cards/professor/studies/steam.png" alt=""></div></div><figcaption>Provisional composition</figcaption></figure></main>
<script>const reduced=matchMedia('(prefers-reduced-motion: reduce)'),books=document.querySelectorAll('.book'),butterflies=document.querySelectorAll('.butterfly'),as=document.querySelectorAll('.steam.a'),bs=document.querySelectorAll('.steam.b');function tick(ms){let frame=reduced.matches?0:Math.floor(ms/280)%8,bf=reduced.matches?0:Math.floor(ms/230)%8,p=reduced.matches?0:(ms%6000)/6000,q=(p+.5)%1;books.forEach(x=>x.style.backgroundPosition=`${frame%4*100/3}% ${frame<4?0:100}%`);butterflies.forEach(x=>x.style.backgroundPosition=`${bf%4*100/3}% ${bf<4?0:100}%`);as.forEach(a=>{a.style.transform=`translateY(${-(p-.5)*20}%)`;a.style.opacity=Math.sin(Math.PI*p)**2*.45});bs.forEach(b=>{b.style.transform=`translateY(${-(q-.5)*20}%)`;b.style.opacity=Math.cos(Math.PI*p)**2*.45});requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></html>
